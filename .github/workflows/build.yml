name: Build and prerelease

on:
  pull_request:
  push:
    branches: [main, int]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.12"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: deno task build:ui
      - run: deno task check:ui
      - run: deno task check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked --no-default-features
      - run: deno task test:demo

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.12"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: deno task build
      - name: Package binary with embedded UI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package artifacts
          if [[ "$TARGET" == *windows* ]]; then
            cp target/release/xe-connect.exe package/
          else
            cp target/release/xe-connect package/
          fi
          cp README.md package/
          tar -czf "artifacts/xe-connect-$TARGET.tar.gz" -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: xe-connect-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/int'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: xe-connect-*
          path: artifacts
          merge-multiple: true
      - name: Publish int prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          tag="int-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$tag" ./*.tar.gz SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "int build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:8})" \
              --generate-notes
          fi
